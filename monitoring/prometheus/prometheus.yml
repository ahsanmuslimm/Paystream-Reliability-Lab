# PayStream Reliability Lab - Prometheus scrape configuration (MVP)
scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: txn-producer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["txn-producer:8080"]

  - job_name: fraud-detector
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-detector:8082"]

  - job_name: notifier
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifier:8083"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
