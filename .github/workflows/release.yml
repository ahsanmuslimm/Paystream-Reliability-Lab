name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, verify and publish (FR-17 release path)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify (full test suite)
        run: mvn -f services/pom.xml -B verify

      - name: Validate configuration (T9)
        run: python kafka-config/scripts/validate-config.py

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push txn-producer image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/txn-producer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/txn-producer:${{ steps.version.outputs.version }}

      - name: Build and push fraud-detector image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/fraud-detector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/fraud-detector:${{ steps.version.outputs.version }}

      - name: Build and push notifier image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/notifier/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/notifier:${{ steps.version.outputs.version }}

      - name: Create GitHub release with the dlq-replay tool
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            services/dlq-replay/target/dlq-replay-*.jar
