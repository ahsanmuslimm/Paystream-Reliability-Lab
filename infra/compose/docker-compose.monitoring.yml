# PayStream Reliability Lab - monitoring overlay (profile: monitoring)
# WP1.7 MVP + WP2.5 full observability: kafka-exporter, Prometheus with the
# complete alert rule set, Alertmanager, Pushgateway (certificate expiry),
# node-exporter (host disk), Loki + Promtail for structured logs, and
# provisioned Grafana dashboards.

services:
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: kafka-exporter
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - "--kafka.server=kafka-1:29092"
      - "--kafka.server=kafka-2:29092"
      - "--kafka.server=kafka-3:29092"
      - "--web.listen-address=:9308"
    ports:
      - "9308:9308"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.4.1}
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - alertmanager
      - pushgateway
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"

  pushgateway:
    image: ${PUSHGATEWAY_IMAGE:-prom/pushgateway:v1.11.0}
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_HOST_PORT:-9091}:9091"

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_HOST_PORT:-9100}:9100"

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.4.2}
    container_name: loki
    restart: unless-stopped
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.4.2}
    container_name: promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ../../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PROMTAIL_HOST_PORT:-9080}:9080"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.0.0}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
