# PayStream Reliability Lab - broker expansion overlay (T13, FR-14)
# Adds kafka-4 as a BROKER-ONLY node: the KRaft quorum stays the original
# three voters (ADR-0001); the new broker registers against it. Expansion of
# quorum voters is deliberately out of scope for the lab.
#
# Scope: plaintext MVP stack (matches the drills' default mode); running the
# secured cluster with four brokers additionally needs a broker-4 certificate
# and the security overlay mounts - documented, exercised after Docker is
# available.
#
# Usage:
#   docker compose --env-file .env -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.monitoring.yml \
#     -f tests/upgrade/docker-compose.expansion.yml up -d kafka-4
# then run tests/upgrade/reassign-partitions.sh

services:
  kafka-4:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
    container_name: kafka-4
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 4
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-4:29092,PLAINTEXT_HOST://localhost:${KAFKA_4_HOST_PORT:-19095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1g -Xms1g}
      # Document 03 section 5.1 baselines, same as the core brokers
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "${KAFKA_4_HOST_PORT:-19095}:19092"
    volumes:
      - kafka-4-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  kafka-4-data:
