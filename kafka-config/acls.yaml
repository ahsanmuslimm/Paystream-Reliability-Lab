# PayStream Reliability Lab - ACL Matrix (source of truth)
# Implements Document 03 (Backend Schema) section 6.
# Applied by kafka-config/scripts/apply-acls.sh (Stage 2, WP2.2); validated by
# validate-config.py. Rules: no wildcard principals, no ALL on '*',
# human users never use service credentials, default deny
# (allow.everyone.if.no.acl.found=false).
#
# User:broker-N (mTLS) are cluster super users for inter-broker traffic only
# and are configured via the security overlay, not here.

acls:
  - principal: User:svc-txn-producer
    resource:
      type: topic
      name: bank.transactions.v1
    operations: [WRITE, DESCRIBE]

  - principal: User:svc-fraud
    resource:
      type: topic
      name: bank.transactions.v1
    operations: [READ, DESCRIBE]
  - principal: User:svc-fraud
    resource:
      type: group
      name: fraud-detector
    operations: [READ]
  - principal: User:svc-fraud
    resource:
      type: topic
      name: bank.fraud-alerts.v1
    operations: [WRITE, DESCRIBE]
  - principal: User:svc-fraud
    resource:
      type: topic
      name: bank.transactions.v1.retry
    operations: [READ, WRITE, DESCRIBE]
  - principal: User:svc-fraud
    resource:
      type: topic
      name: bank.transactions.v1.dlq
    operations: [READ, WRITE, DESCRIBE]
  - principal: User:svc-fraud
    resource:
      type: topic
      name: fraud-detector-
      pattern: prefixed
    operations: [ALL]

  - principal: User:svc-notify
    resource:
      type: topic
      name: bank.fraud-alerts.v1
    operations: [READ, DESCRIBE]
  - principal: User:svc-notify
    resource:
      type: group
      name: notifier
    operations: [READ]
  - principal: User:svc-notify
    resource:
      type: topic
      name: bank.notifications.v1
    operations: [WRITE, DESCRIBE]
  # ADR-0006 addition: notifier poison path mirrors the transactions domain
  # (Document 03 lists .retry/.dlq only for the transactions domain)
  - principal: User:svc-notify
    resource:
      type: topic
      name: bank.fraud-alerts.v1.retry
    operations: [READ, WRITE, DESCRIBE]
  - principal: User:svc-notify
    resource:
      type: topic
      name: bank.fraud-alerts.v1.dlq
    operations: [READ, WRITE, DESCRIBE]

  - principal: User:svc-connect
    resource:
      type: topic
      name: pg.
      pattern: prefixed
    operations: [READ, WRITE, CREATE, DESCRIBE]
  - principal: User:svc-connect
    resource:
      type: topic
      name: connect-
      pattern: prefixed
    operations: [READ, WRITE, CREATE, DESCRIBE]
  # ADR-0006 addition: Connect's worker consumer group (internal topics are
  # already declared in topics.yaml as connect-*)
  - principal: User:svc-connect
    resource:
      type: group
      name: connect-cluster
    operations: [READ]

  # ADR-0006 addition: Schema Registry authenticates with SCRAM on the
  # secured cluster and manages the compacted _schemas topic itself
  - principal: User:svc-schema-registry
    resource:
      type: topic
      name: _schemas
    operations: [READ, WRITE, CREATE, DESCRIBE, DESCRIBE_CONFIGS, ALTER_CONFIGS]
  - principal: User:svc-schema-registry
    resource:
      type: cluster
      name: kafka-cluster
    operations: [DESCRIBE]

  # ADR-0006 addition: kafka-exporter principal for FR-10/FR-11 metrics.
  # Prefixed grants avoid wildcard resources while covering all domains.
  - principal: User:svc-monitor
    resource:
      type: cluster
      name: kafka-cluster
    operations: [DESCRIBE, DESCRIBE_CONFIGS]
  - principal: User:svc-monitor
    resource:
      type: topic
      name: bank.
      pattern: prefixed
    operations: [DESCRIBE]
  - principal: User:svc-monitor
    resource:
      type: topic
      name: pg.
      pattern: prefixed
    operations: [DESCRIBE]
  - principal: User:svc-monitor
    resource:
      type: topic
      name: connect-
      pattern: prefixed
    operations: [DESCRIBE]
  - principal: User:svc-monitor
    resource:
      type: group
      name: fraud-detector
    operations: [READ]
  - principal: User:svc-monitor
    resource:
      type: group
      name: notifier
    operations: [READ]

  - principal: User:svc-admin-ci
    resource:
      type: cluster
      name: kafka-cluster
    operations: [CREATE, ALTER, DESCRIBE]
